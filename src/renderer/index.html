<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面看板娘</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    #live2d-canvas {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }
    #reaction-bubble {
      position: fixed;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.92);
      color: #333;
      border-radius: 14px;
      padding: 6px 14px;
      font-size: 15px;
      font-family: 'Microsoft YaHei', sans-serif;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: none;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    #reaction-bubble.show {
      animation: bubble-pop 2s ease-out forwards;
    }
    @keyframes bubble-pop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      12%  { opacity: 1; transform: translate(-50%, -60%) scale(1.08); }
      20%  { transform: translate(-50%, -70%) scale(1); }
      75%  { opacity: 1; transform: translate(-50%, -85%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -100%) scale(0.8); }
    }
  </style>
</head>
<body>
  <canvas id="live2d-canvas"></canvas>
  <div id="reaction-bubble"></div>

  <!-- Cubism 4 Core -->
  <script src="../../public/live2dcubismcore.min.js"></script>
  <!-- PIXI.js v6 -->
  <script src="../../public/pixi.min.js"></script>
  <!-- pixi-live2d-display Cubism 4 bundle -->
  <script src="../../public/cubism4.min.js"></script>

  <script src="app.js"></script>
</body>
</html>
