<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面看板娘</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    /* 调试背景 - 让窗口可见 */
    #debug-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(100, 150, 255, 0.2);
      pointer-events: none;
      z-index: 0;
    }
    #live2d-canvas {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* 聊天气泡（短语/点击反应） */
    #reaction-bubble {
      position: fixed;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.92);
      color: #333;
      border-radius: 14px;
      padding: 6px 14px;
      font-size: 15px;
      font-family: 'Microsoft YaHei', sans-serif;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: none;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    #reaction-bubble.show {
      animation: bubble-pop 2s ease-out forwards;
    }

    /* AI 回复气泡（多行，长文本） */
    #ai-bubble {
      position: fixed;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.94);
      color: #333;
      border-radius: 16px;
      padding: 10px 16px;
      font-size: 14px;
      font-family: 'Microsoft YaHei', sans-serif;
      max-width: 300px;
      line-height: 1.6;
      opacity: 0;
      z-index: 11;
      box-shadow: 0 3px 12px rgba(0,0,0,0.18);
      transform: translateX(-50%);
      transition: opacity 0.3s;
    }
    #ai-bubble.show {
      opacity: 1;
    }

    /* 聊天输入区域 */
    #chat-input-area {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 20;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 22px;
      padding: 6px 12px 6px 18px;
      backdrop-filter: blur(6px);
      box-shadow: 0 2px 16px rgba(0,0,0,0.3);
    }
    #chat-input-area.active {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #chat-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      font-family: 'Microsoft YaHei', sans-serif;
      width: 220px;
      line-height: 1.4;
    }
    #chat-input::placeholder {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
    }
    #chat-send-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #chat-send-btn:hover {
      background: rgba(255,255,255,0.35);
    }

    /* 气泡弹出动画 */
    @keyframes bubble-pop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      12%  { opacity: 1; transform: translate(-50%, -60%) scale(1.08); }
      20%  { transform: translate(-50%, -70%) scale(1); }
      75%  { opacity: 1; transform: translate(-50%, -85%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -100%) scale(0.8); }
    }
  </style>
</head>
<body>
  <div id="debug-bg"></div>
  <div id="status-text" style="position:fixed;bottom:10px;left:10px;color:#fff;font-size:14px;font-family:sans-serif;z-index:999;background:rgba(0,0,0,0.6);padding:4px 10px;border-radius:6px;">启动中…</div>
  <canvas id="live2d-canvas"></canvas>
  <div id="reaction-bubble"></div>
  <div id="ai-bubble"></div>

  <!-- 聊天输入框 -->
  <div id="chat-input-area">
    <input id="chat-input" type="text" placeholder="和灵梦说点什么…" maxlength="200" autocomplete="off">
    <button id="chat-send-btn">▶</button>
  </div>

  <!-- Cubism 4 Core -->
  <script src="../../public/live2dcubismcore.min.js"></script>
  <!-- PIXI.js v6 -->
  <script src="../../public/pixi.min.js"></script>
  <!-- pixi-live2d-display Cubism 4 bundle -->
  <script src="../../public/cubism4.min.js"></script>

  <script src="app.js"></script>
</body>
</html>
